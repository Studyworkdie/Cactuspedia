<title>Sukulenty a kaktusy</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#3f7d4e"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f7f1;--card:#fff;--tx:#1f2a1f;--mut:#64735f;--ac:#3f7d4e;--ln:#dde5d8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a14;--card:#1b261e;--tx:#e8f0e6;--mut:#9bb09a;--ac:#7cc48c;--ln:#2b3a2f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--card:#121212;--tx:#ececec;--mut:#9a9a9a;--ac:#7cc48c;--ln:#2a2a2a;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,Roboto,sans-serif}
header{padding:16px 16px 8px}h1{margin:0 0 10px;font-size:22px}
input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font-size:16px}
.top{display:flex;align-items:center;justify-content:space-between;position:relative;margin-bottom:10px}.top h1{margin:0}.dots{background:none;border:none;color:var(--tx);font-size:28px;line-height:1;padding:4px 10px}.mn{position:absolute;right:0;top:100%;background:var(--card);border:1px solid var(--ln);border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.35);z-index:5;overflow:hidden}.mn button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--tx);font-size:15px;padding:13px 18px;white-space:nowrap}.chips{display:flex;gap:8px;margin-top:10px}@media(display-mode:standalone){.inst:not(.tgl){display:none}}.inst{margin:0 0 10px;padding:8px 14px;border-radius:20px;border:1px solid var(--ac);background:transparent;color:var(--ac);font-size:14px}.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:9}.sh{background:var(--card);color:var(--tx);border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));width:100%;max-width:700px}.sh h3{margin:0 0 8px}.sh ol{padding-left:20px;margin:0 0 12px}.sh code{display:block;word-break:break-all;font-size:12px;color:var(--mut);margin-bottom:12px}.sh button{margin-right:8px}
.chip{padding:8px 14px;border-radius:20px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font-size:14px}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:8px 16px 24px;max-width:700px;margin:auto}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;overflow:hidden;text-align:left;padding:0;color:var(--tx);font:inherit}
.card svg{display:block;width:100%}.wa *{fill-opacity:.38;stroke:#2a1d12!important;stroke-width:1!important;stroke-linejoin:round}.hh *{fill:url(#hatch)!important;stroke:none!important}.card b,.det h2{font-family:Georgia,'Times New Roman',serif}.card i,.lat{font-family:Georgia,'Times New Roman',serif}
.card div{padding:8px 12px 12px}.card b{display:block;font-size:15px}.card i{font-size:12px;color:var(--mut)}
.det{max-width:700px;margin:auto;padding-bottom:24px}
.back{margin:12px 16px;padding:8px 14px;border-radius:20px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font-size:14px}
.det svg{width:100%;max-height:340px}
.det .in{padding:16px}.det h2{margin:0}.lat{color:var(--mut);font-style:italic;margin:2px 0 12px}
.tag{display:inline-block;padding:3px 10px;border-radius:12px;background:var(--ac);color:#fff;font-size:12px}
.row{display:flex;gap:12px;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-top:10px}
.row span{font-size:22px}.row b{display:block;font-size:13px;color:var(--mut);font-weight:600}
.ph{padding:10px 10px 0;background:radial-gradient(ellipse at 0 0,rgba(176,128,70,.55),transparent 45%),radial-gradient(ellipse at 100% 100%,rgba(160,110,55,.5),transparent 50%),url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3'/><feColorMatrix values='0 0 0 0 .45 0 0 0 0 .33 0 0 0 0 .15 0 0 0 .35 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),#ecdcb6;box-shadow:inset 0 0 28px rgba(110,70,25,.45)}
.card .ph{padding:8px 8px 0}
.ph .cap{font:12px/1.35 Georgia,'Times New Roman',serif;text-align:center;color:#2a1d12;padding:4px 6px 12px}.ph .cap i{font-size:11px}
.ph img{display:block;width:100%;aspect-ratio:1;object-fit:cover;filter:url(#sk);mix-blend-mode:multiply}.det .ph img{height:340px;aspect-ratio:auto}.empty{padding:30px;text-align:center;color:var(--mut)}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><pattern id="hatch" width="3.5" height="3.5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="3.5" stroke="#3a2a1a" stroke-width=".7" opacity=".6"/></pattern><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset=".3" stop-color="#000"/><stop offset=".85" stop-color="#fff"/></linearGradient><mask id="sm" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200"><rect width="200" height="200" fill="url(#sg)"/></mask><filter id="wob" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".04" numOctaves="2" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.2"/></filter><filter id="sk" color-interpolation-filters="sRGB" x="0" y="0" width="100%" height="100%"><feColorMatrix type="saturate" values="0" result="g"/><feGaussianBlur in="g" stdDeviation=".7" result="b"/><feConvolveMatrix in="b" order="3" kernelMatrix="-1 -1 -1 -1 8 -1 -1 -1 -1" divisor="1" preserveAlpha="true" result="e"/><feComponentTransfer in="e" result="l"><feFuncR type="linear" slope="-5" intercept="1"/><feFuncG type="linear" slope="-5" intercept="1"/><feFuncB type="linear" slope="-5" intercept="1"/></feComponentTransfer><feComponentTransfer in="g" result="t"><feFuncR type="linear" slope=".35" intercept=".65"/><feFuncG type="linear" slope=".35" intercept=".65"/><feFuncB type="linear" slope=".35" intercept=".65"/></feComponentTransfer><feBlend in="l" in2="t" mode="multiply"/></filter></defs></svg>

<script>
const P=[
["Echeveria elegans","Echeveria elegans","Sukulent","rosette",["#9fd3c0","#b9e2d3","#d3efe4"],"#e87fa0","Jasné svetlo, aspoň 4 – 6 hodín slnka denne. Na tmavom mieste sa pretiahne.","Zalievajte až keď pôda úplne vyschne (v lete raz za 10 – 14 dní, v zime takmer vôbec). Nelejte vodu do stredu rozety.","Priepustný substrát pre kaktusy s pridaným pieskom alebo perlitom.","18 – 27 °C. V zime 8 – 12 °C, mráz neznáša.","Listovými odrezkami alebo odnožami.","Pri nedostatku svetla „vytiahne“ stonku – presuňte ju bližšie k oknu."],
["Aloe vera","Aloe vera","Sukulent","aloe",["#6fb06a","#8cc783"],"","Veľa svetla, v lete môže byť vonku na čiastočnom tieni.","Zalievajte hojne, ale len keď je zemina úplne suchá (cca raz za 2 – 3 týždne).","Ľahký piesčitý substrát s výbornou drenážou.","15 – 30 °C. Pod 10 °C trpí.","Odnožami (pupkami) pri základe materskej rastliny.","Gél z listov sa tradične používa na pokožku po popálení slnkom."],
["Tučnolistá (Crassula)","Crassula ovata","Sukulent","tree",["#4f9a5a","#6fb877"],"","Jasné svetlo, znesie aj priame slnko. Na slnku červenajú okraje listov.","Mierne, keď zemina vyschne. V zime zalievajte len sporadicky.","Zmes zeminy pre kaktusy a piesku.","10 – 28 °C. Prezimuje v chlade a svetle.","Odrezkami stoniek alebo jednotlivými listami.","Môže žiť desiatky rokov a časom vytvorí hrubý „stromček“."],
["Haworthia pásikavá","Haworthiopsis fasciata","Sukulent","haw",["#3f7d4e","#5a9a62"],"","Svetlý polotieň, neznáša páľavé poludňajšie slnko.","Menej často – každé 2 – 3 týždne, v zime raz za mesiac.","Veľmi priepustný substrát, menšie hrnce.","15 – 27 °C. Nad 5 °C v zime.","Odnožami pri základe.","Skvelá do bytov – znesie aj menej svetla ako väčšina sukulentov."],
["Lithops (živý kameň)","Lithops spp.","Sukulent","lith",["#b8a99a","#c9b8a7"],"#f7e25a","Maximum slnka. Potrebuje jasné miesto na južnom okne.","Veľmi málo. Zalievajte len na jeseň počas kvitnutia, v zime a na jar vôbec.","Minerálny substrát s pieskom a štrkom, takmer bez humusu.","10 – 30 °C. Pri suchu znesie aj chlad.","Semenami, výnimočne delením.","Staré listy na jar vysychajú a nahradia ich nové – nezasahujte."],
["Senecio – šnúrka perál","Senecio rowleyanus","Sukulent","pearls",["#8ac47a","#a4d596"],"","Jasné rozptýlené svetlo, vyhýbajte sa páľave.","Mierne – keď sú guľôčky mierne vráskavé. Nenechajte stáť vo vode.","Ľahký substrát s veľkým podielom piesku.","15 – 25 °C. V zime nie pod 10 °C.","Odrezkami stoniek položenými na zeminu.","Je jedovatá pre ľudí aj zvieratá, držte mimo dosahu."],
["Kaktus – zlatá guľa","Echinocactus grusonii","Kaktus","barrel",["#7bb26a","#5e9a56"],"#f2d14a","Plné slnko, čím viac, tým lepšie.","V lete raz za 2 týždne, v zime vôbec.","Minerálny substrát s pieskom, drenáž na dne.","15 – 35 °C. V zime chladne a sucho (8 – 12 °C).","Semenami; kvitne až po rokoch.","Rastie pomaly, ale môže dosiahnuť priemer aj vyše 50 cm."],
["Opuncia (figovník)","Opuntia ficus-indica","Kaktus","paddle",["#6ea36a","#7fb77a"],"#f2a93b","Plné slnko, v lete môže byť vonku.","Mierne – pôda musí medzi zálievkami úplne vyschnúť.","Piesčitá, chudobná zemina.","12 – 35 °C. Niektoré druhy znesú aj mráz.","Odrezanými článkami, ktoré nechajte pár dní zaschnúť.","Pozor na drobné chlpaté ostne (glochidy) – manipulujte v rukaviciach."],
["Mammillaria","Mammillaria spp.","Kaktus","mam",["#86b87a","#6fa06a"],"#e9559a","Veľa svetla, ranné a podvečerné slnko.","Od jari do jesene mierne, v zime vôbec.","Priepustný substrát pre kaktusy.","12 – 30 °C. V zime 5 – 10 °C pre kvitnutie.","Odnožami alebo semenami.","Na jar vytvára veniec drobných kvetov okolo vrchu."],
["Cereus (stĺpový kaktus)","Cereus peruvianus","Kaktus","column",["#6aa0a0","#5a9090"],"#f6f0e6","Plné slnko, v lete vonku.","V lete raz za 10 – 14 dní, v zime nezalievať.","Piesčitá zemina s kamienkami.","15 – 35 °C. V zime min. 8 °C.","Odrezkami stonky (nechajte zaschnúť).","Dokáže vyrásť do výšky niekoľkých metrov."],
["Vianočný kaktus","Schlumbergera truncata","Kaktus","xmas",["#5fa66a","#76b97f"],"#e0457b","Jasné rozptýlené svetlo, bez páľavy.","Pravidelne mierne, zemina nemá úplne vyschnúť. Vyžaduje vlhkosť vzduchu.","Voľná humózna zemina s pieskom.","15 – 24 °C. Na kvitnutie potrebuje chladno a tmu (cca 12 °C).","Odrezkami článkov, ktoré skrúťte z rastliny.","Nepresúvajte ho počas tvorby púčikov – inak ich odhodí."]
];
const PL=[["#6fb06a","#8cc783","#a8d89c"],["#9fd3c0","#b9e2d3","#d3efe4"],["#a98bc4","#c3a8d8","#dac8e8"],["#d98a8a","#e8a8a8","#f2c4c4"],["#8fb3c4","#a8c8d6","#c2dbe6"],["#b5cf6a","#c9de88","#dcebaa"],["#3f7d4e","#5a9a62","#78b27f"],["#b8a99a","#c9b8a7","#d8cabb"],["#c4a0a0","#d4b4b0","#e4c8c4"]],FL=["#e8559a","#f2d14a","#e04545","#f2a93b","#f6f0e6","#c04aa0"];
const PR={
E:["Sukulent","rosette","Veľa jasného svetla, aspoň 4 – 6 hodín slnka. Na tmavom mieste sa pretiahne.","Až keď substrát úplne vyschne; v zime minimálne. Nelejte vodu do stredu rozety.","Priepustný substrát pre kaktusy s pieskom alebo perlitom.","18 – 27 °C. V zime 8 – 12 °C, mráz neznáša.","Listovými odrezkami alebo odnožami.","Na slnku farby zintenzívnejú."],
G:["Sukulent","rosette","Jasné svetlo, v lete znesie polotieň; páľava poškodzuje listy.","Rastie v zime a na jar – vtedy zalievajte pravidelne. V lete oddychuje a vtedy takmer vôbec.","Piesčitý, priepustný substrát.","10 – 25 °C. Nad 30 °C upadá do pokoja.","Odrezkami stoniek s rozetou.","Je to „zimný“ sukulent – opačný rytmus ako väčšina ostatných."],
S:["Sukulent","rosette","Plné slnko, vhodné na skalku a do záhrady.","Veľmi málo; stačí dážď. V kvetináči zalievajte zriedka.","Chudobná, kamenistá, priepustná zemina.","Úplne mrazuvzdorné (do cca −30 °C).","Dcérskymi rozetami (odnožami).","Materská rozeta po odkvitnutí odumiera, no nahradia ju mladé."],
A:["Sukulent","aloe","Jasné svetlo, v lete môže byť vonku na čiastočnom tieni.","Dôkladne, ale len keď je zemina úplne suchá (raz za 2 – 3 týždne).","Ľahký piesčitý substrát s dobrou drenážou.","15 – 30 °C. Pod 8 °C trpí.","Odnožami pri základe.","Dobre znáša aj menej svetla a suchý vzduch."],
V:["Sukulent","aloe","Plné slnko, v lete vonku.","Mierne; v lete raz za 2 týždne, v zime takmer vôbec.","Piesčitý substrát s veľmi dobrou drenážou, hlboký kvetináč.","10 – 35 °C. Niektoré druhy znesú aj mierny mráz.","Odnožami, výnimočne semenami.","Končeky listov sú ostré – umiestnite mimo detí a zvierat."],
N:["Sukulent","aloe","Nenáročná, znesie aj tienisté miesto, ale rastie pomalšie.","Zriedka – raz za 2 – 4 týždne. Preliatie je najčastejšia príčina hniloby.","Priepustný substrát, ťažší kvetináč kvôli stabilite.","15 – 30 °C. Pod 10 °C poškodenie.","Delením koreňového balu alebo listovými odrezkami.","Je to výborná izbová rastlina aj pre začiatočníkov."],
H:["Sukulent","haw","Svetlý polotieň, neznáša páľavé poludňajšie slnko.","Raz za 2 – 3 týždne, v zime raz za mesiac.","Veľmi priepustný substrát, menšie hrnce.","15 – 27 °C. V zime nad 5 °C.","Odnožami pri základe.","Znesie aj menej svetla než väčšina sukulentov."],
C:["Sukulent","tree","Jasné svetlo, znesie aj priame slnko.","Mierne, keď zemina vyschne. V zime sporadicky.","Zmes zeminy pre kaktusy a piesku.","10 – 28 °C. Prezimuje v chlade a na svetle.","Odrezkami stoniek alebo listami.","Časom vytvorí hrubý „stromček“."],
Q:["Sukulent","tree","Jasné svetlo, ráno a podvečer priame slnko.","Keď zemina vyschne; nikdy nenechajte stáť vo vode.","Priepustná zmes s pieskom.","15 – 28 °C. Pod 10 °C trpí.","Odrezkami, listami alebo dcérskymi rastlinkami na listoch.","Šťava môže dráždiť; väčšina druhov je jedovatá pre zvieratá."],
L:["Sukulent","lith","Maximum slnka, južné okno.","Veľmi málo. Zalievajte len na jeseň; v zime a na jar vôbec.","Minerálny substrát s pieskom a štrkom.","10 – 30 °C. Pri suchu znesie aj chlad.","Semenami, výnimočne delením.","Staré listy na jar vyschnú – nezasahujte, rastlina sa „prelieva“."],
T:["Sukulent","pearls","Jasné rozptýlené svetlo, bez páľavy.","Mierne – keď sú listy mierne vráskavé.","Ľahký substrát s veľkým podielom piesku.","15 – 25 °C. V zime nie pod 10 °C.","Odrezkami stoniek položenými na zeminu.","Vhodná do závesného košíka."],
B:["Kaktus","barrel","Plné slnko, čím viac, tým lepšie.","V lete raz za 2 týždne, v zime vôbec.","Minerálny substrát s pieskom, drenáž na dne.","15 – 35 °C. V zime chladne a sucho (8 – 12 °C).","Semenami alebo odnožami.","Rastie pomaly; kvitne až po niekoľkých rokoch."],
M:["Kaktus","mam","Veľa svetla, ranné a podvečerné slnko.","Od jari do jesene mierne, v zime vôbec.","Priepustný substrát pre kaktusy.","12 – 30 °C. V zime 5 – 10 °C pre kvitnutie.","Odnožami alebo semenami.","Na jar vytvára veniec drobných kvetov."],
O:["Kaktus","paddle","Plné slnko, v lete vonku.","Mierne; pôda musí medzi zálievkami úplne vyschnúť.","Piesčitá, chudobná zemina.","12 – 35 °C. Niektoré druhy znesú aj mráz.","Odrezanými článkami (nechajte zaschnúť).","Pozor na jemné ostne (glochidy) – používajte rukavice."],
K:["Kaktus","column","Plné slnko, v lete vonku.","V lete raz za 10 – 14 dní, v zime nezalievať.","Piesčitá zemina s kamienkami.","15 – 35 °C. V zime min. 8 °C.","Odrezkami stonky (nechajte zaschnúť) alebo semenami.","Dokáže vyrásť do výšky niekoľkých metrov."],
F:["Kaktus","xmas","Jasné rozptýlené svetlo, bez priameho poludňajšieho slnka.","Pravidelne mierne; zemina nemá úplne vyschnúť. Ocení vyššiu vlhkosť.","Voľná humózna zemina s pieskom alebo kôrou.","15 – 25 °C. Kvitnutie podporí chladnejšie obdobie.","Odrezkami článkov.","V prírode rastie na stromoch, nie v púšti."],
Y:["Sukulent","column","Veľa svetla, v lete môže byť vonku.","Mierne, keď zemina vyschne; v zime takmer vôbec.","Priepustný substrát pre kaktusy.","15 – 32 °C. Pod 10 °C trpí.","Odrezkami (nechajte zaschnúť) alebo semenami.","Mliečna šťava je jedovatá a dráždi pokožku – používajte rukavice."]};
